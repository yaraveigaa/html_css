<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video video width="600" poster="teste/imagens/limoes-capa.png" controls autoplay>
        <source src="teste/midia/meu-video.webm" type="video/webm">
        <source src="teste/midia/meu-video.mp4" type="video/mp4">
        <source src="teste/midia/meu-video.ogv" type="video/ogv">
        <source src="teste/midia/meu-video.m4v" type="video/mp4v">        
    </video>
    <h1>Inserindo vídeos do YouTube</h1>
<iframe 
    width="560" 
    height="315" 
    src="https://www.youtube.com/embed/pWDF8csG9Qo" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    allowfullscreen>
</iframe>
    <h1>Inserindo vídeos do Vimeo</h1>
    <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/90134780?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Big As Life | DOCUMENTARIO"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
