<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
   <h1>Imagem dinâmica</h1>   
   <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p> 
   <picture>
    <source media="(max-width: 350px)" srcset="teste/imagens/foto-p.png" type="image/png">
    <source media="(max-width: 750px)" srcset="teste/imagens/foto-m.png" type="image/png">
    <img src="teste/imagens/foto-g.png" alt="Imagem flexivel funciona">
   </picture>
   <h1>Reproduzindo Áudio</h1>
   <p>Vamos aprender a reproduzir áudios em HTML5.</p>
   <audio preload="metadata" controls autoplay loop>
    <source src="teste/midia/guanacast-33.mp3" type="audio/mpeg">
    <source src="teste/midia/guanacast-33.ogg" type="audio/ogg">
    <source src="teste/midia/guanacast-33.wav" type="audio/wav">
   </audio>
</body>
</html>
